# Credentials match the docker-compose.yml service at repo root.
# For local dev: docker compose up db
# Override any value via DATABASE_URL env var.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "weather_mvp") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>

development:
  <<: *default
  database: weather_mvp_development

test:
  <<: *default
  database: weather_mvp_test

production:
  <<: *default
  database: weather_mvp_production
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>
